<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 229" width="760" height="229"><g font-family="Segoe UI, Arial, sans-serif"><rect x="0.5" y="0.5" width="759" height="228" rx="10" fill="#F2F3F5" stroke="#B9C1CB"/><text x="23" y="31" fill="#3E5F9D" font-size="16" font-weight="650">ArchiTECH</text><text x="119" y="31" fill="#17202C" font-size="17" font-weight="650">Split Region with Line — Dependent review</text><text x="619" y="31" fill="#4A5465" font-size="13" font-weight="500">Light</text><text x="726" y="31" fill="#4A5465" font-size="19" font-weight="400">×</text><rect x="0" y="49" width="760" height="1" rx="0" fill="#B9C1CB" stroke="none"/><text x="22" y="77" fill="#4A5465" font-size="14" font-weight="400">One selected element has a dependent element that Revit will delete with the original.</text><rect x="22" y="96" width="716" height="38" rx="0" fill="#F8F9FC" stroke="#B9C1CB"/><text x="32" y="119" fill="#17202C" font-size="14" font-weight="400">Safe option</text><rect x="308.40000000000003" y="96" width="1" height="38" rx="0" fill="#B9C1CB" stroke="none"/><text x="318.40000000000003" y="119" fill="#17202C" font-size="14" font-weight="400">Split only elements nothing depends on.</text><rect x="22" y="134" width="716" height="38" rx="0" fill="#FFFFFF" stroke="#B9C1CB"/><text x="32" y="157" fill="#17202C" font-size="14" font-weight="400">Split all</text><rect x="308.40000000000003" y="134" width="1" height="38" rx="0" fill="#B9C1CB" stroke="none"/><text x="318.40000000000003" y="157" fill="#17202C" font-size="14" font-weight="400">Dependent elements on the originals are deleted.</text><rect x="585.5" y="185" width="152.5" height="29" rx="5" fill="#3E5F9D" stroke="#B9C1CB"/><text x="597.5" y="204" fill="#FFFFFF" font-size="13" font-weight="550">Split all of them</text><rect x="380" y="185" width="197.5" height="29" rx="5" fill="#FFFFFF" stroke="#B9C1CB"/><text x="392" y="204" fill="#17202C" font-size="13" font-weight="550">Skip those 1 element(s)</text></g>